<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Rumbleback: Replay any earthquake. See your seconds.</title>
    <meta
      name="description"
      content="Replay a real earthquake in your browser: P and S waves roll across the map, real seismometers light up as they arrive, and a pin on your home shows how many seconds you had."
    />
    <meta name="theme-color" content="#090d12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#e9eef3" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="canonical" href="__SITE_URL__" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rumbleback" />
    <meta property="og:url" content="__SITE_URL__" />
    <meta property="og:title" content="Rumbleback: replay any earthquake" />
    <meta
      property="og:description"
      content="P and S waves rolling across the map, checked against real seismometers. Drop a pin on your home to see your seconds."
    />
    <meta property="og:image" content="__SITE_URL__social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="675" />
    <meta
      property="og:image:alt"
      content="The 2024 Hualien earthquake replayed on a map: a blue P ring inside an orange S ring over a ShakeMap of Taiwan"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rumbleback: replay any earthquake" />
    <meta
      name="twitter:description"
      content="Watch the P and S waves of a real earthquake cross the map, then pin your home to see your seconds."
    />
    <meta name="twitter:image" content="__SITE_URL__social-card.png" />
    <script>
      // The theme before the first paint, so a light screen does not start dark.
      (function () {
        try {
          var saved = localStorage.getItem('rumbleback.theme');
          var light = saved === 'light' || (saved !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches);
          document.documentElement.dataset.theme = light ? 'light' : 'dark';
          // A choice made in the page beats the system setting for the browser's own bar as well.
          if (saved === 'light' || saved === 'dark') {
            var bars = document.querySelectorAll('meta[name="theme-color"]');
            for (var i = 0; i < bars.length; i++) {
              bars[i].setAttribute('content', light ? '#e9eef3' : '#090d12');
              bars[i].removeAttribute('media');
            }
          }
        } catch (e) {}
      })();
    </script>
    <noscript
      ><style>
        #boot {
          display: none !important;
        }
      </style></noscript
    >
    <link rel="stylesheet" href="assets/app.css?v=__VERSION__" />
  </head>
  <body>
    <div class="boot" id="boot" aria-hidden="true">
      <span class="boot-rings"><i></i><i></i><b></b></span>
      <span class="boot-name">Rumbleback</span>
    </div>
    <noscript>Rumbleback needs JavaScript to draw the map and replay the waves.</noscript>
    <script>
      // If the app script cannot be fetched or cannot start, say so here instead of spinning for ever.
      (function () {
        function failed(e) {
          var boot = document.getElementById('boot');
          if (!boot || boot.hasAttribute('data-failed')) return;
          var from = (e.target && e.target.src) || e.filename || (e.reason && e.reason.stack) || '';
          if (String(from).indexOf('assets/app.js') < 0) return;
          boot.setAttribute('data-failed', '');
          boot.removeAttribute('aria-hidden');
          var note = document.createElement('p');
          note.className = 'boot-error';
          note.setAttribute('role', 'alert');
          note.textContent = 'Rumbleback could not start. Reload the page, or open it in a current browser that supports WebGL 2.';
          boot.appendChild(note);
        }
        window.addEventListener('error', failed, true);
        window.addEventListener('unhandledrejection', failed);
      })();
    </script>
    <script type="module" src="assets/app.js?v=__VERSION__"></script>
  </body>
</html>
